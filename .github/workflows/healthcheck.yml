name: CF订阅健康检查与自动修复

on:
  schedule:
    - cron: '17 5,11,17,23 * * *'
  workflow_dispatch: {}

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: 运行健康检查（异常自动 Redeploy）
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          python3 .github/scripts/healthcheck.py

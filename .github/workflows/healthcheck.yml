name: CF Subscription Health Check

on:
  schedule:
    - cron: '17 5,11,17,23 * * *'
  workflow_dispatch: {}

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run health check and auto-fix
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          python3 .github/scripts/healthcheck.py
